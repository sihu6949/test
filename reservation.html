<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESERVE - NOIR PATISSERIE</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="reservation.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
  <header id="header">
    <div class="header-inner">
      <div class="logo"><a href="index.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:12px;"><span class="logo-en">NOIR</span><span class="logo-divider">✦</span><span class="logo-en">PATISSERIE</span></a></div>
      <div class="hamburger" onclick="toggleMenu()" id="hamburger"><span></span><span></span><span></span></div>
      <nav id="nav">
        <a href="index.html">HOME</a>
        <a href="menu.html">MENU</a>
        <a href="reservation.html">RESERVE</a>
        <a href="index.html#contact">VISIT</a>
      </nav>
    </div>
  </header>
  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html" onclick="toggleMenu()">HOME</a>
    <a href="menu.html" onclick="toggleMenu()">MENU</a>
    <a href="reservation.html" onclick="toggleMenu()">RESERVE</a>
    <a href="index.html#contact" onclick="toggleMenu()">VISIT</a>
  </div>
  <div class="page-hero">
    <p class="section-tag">RESERVATION</p>
    <h1>예약</h1>
    <p>특별한 순간을 위해 자리를 예약하세요</p>
  </div>
  <section class="reservation-section fade-in">
    <div class="form-box">
      <div class="form-row">
        <div class="form-group">
          <label>이름 <span class="req">*</span></label>
          <input type="text" id="name" placeholder="성함을 입력하세요">
          <span class="err" id="name-error">이름을 입력해주세요</span>
        </div>
        <div class="form-group">
          <label>연락처 <span class="req">*</span></label>
          <input type="tel" id="phone" placeholder="010-0000-0000">
          <span class="err" id="phone-error">연락처를 입력해주세요</span>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>날짜</label>
          <input type="date" id="date">
        </div>
        <div class="form-group">
          <label>시간</label>
          <select id="time">
            <option>10:00</option><option>11:00</option><option>12:00</option>
            <option>13:00</option><option>14:00</option><option>15:00</option>
            <option>16:00</option><option>17:00</option><option>18:00</option>
            <option>19:00</option><option>20:00</option><option>21:00</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>인원</label>
        <select id="people">
          <option>1명</option><option>2명</option><option>3명</option>
          <option>4명</option><option>5명 이상</option>
        </select>
      </div>
      <div class="form-group">
        <label>요청사항</label>
        <textarea id="message" placeholder="특별한 요청사항이 있으시면 입력해주세요 (기념일, 알레르기 등)"></textarea>
      </div>
      <button class="btn-submit" id="submit-btn" onclick="submitReservation()">예약 신청하기</button>
    </div>
  </section>
  <footer>
    <div class="footer-inner">
      <div class="footer-logo">NOIR ✦ PATISSERIE</div>
      <p class="footer-desc">장인의 손길로 빚어낸 프리미엄 디저트</p>
      <p class="footer-copy">© 2026 Noir Patisserie. All rights reserved.</p>
    </div>
  </footer>
  <script src="script.js"></script>
  <script>
    emailjs.init('W0iHjgxDYsff4cmQS');
    function toggleMenu() {
      document.getElementById('mobileMenu').classList.toggle('open');
      document.getElementById('hamburger').classList.toggle('active');
    }
    function submitReservation() {
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      let valid = true;
      if (!name) { document.getElementById('name-error').style.display = 'block'; document.getElementById('name').classList.add('input-error'); valid = false; }
      else { document.getElementById('name-error').style.display = 'none'; document.getElementById('name').classList.remove('input-error'); }
      if (!phone) { document.getElementById('phone-error').style.display = 'block'; document.getElementById('phone').classList.add('input-error'); valid = false; }
      else { document.getElementById('phone-error').style.display = 'none'; document.getElementById('phone').classList.remove('input-error'); }
      if (!valid) return;
      const btn = document.getElementById('submit-btn');
      btn.textContent = '전송 중...';
      btn.disabled = true;
      emailjs.send('test123', 'template_r5059gq', {
        name, phone,
        date: document.getElementById('date').value || '미정',
        time: document.getElementById('time').value,
        people: document.getElementById('people').value,
        message: document.getElementById('message').value || '없음'
      }).then(() => {
        alert('예약이 신청되었습니다!\n확인 후 연락드리겠습니다 ✦');
        btn.textContent = '예약 신청하기';
        btn.disabled = false;
        document.getElementById('name').value = '';
        document.getElementById('phone').value = '';
        document.getElementById('date').value = '';
        document.getElementById('message').value = '';
      }).catch(err => {
        alert('전송 중 오류가 발생했습니다. 다시 시도해주세요.');
        btn.textContent = '예약 신청하기';
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
